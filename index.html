<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选课辅助系统 - 支持单双周</title>

<style>
:root {
    --sidebar-bg: #1e293b;
    --main-bg: #f1f5f9;
    --primary: #3b82f6;
    --border: #e2e8f0;
    --accent: #f43f5e;
    --highlight: #f59e0b;
    --success: #16a34a;
    --success-light: #dcfce7;
    --danger: #e11d48;
    --danger-light: #ffe4e6;
    --purple: #7c3aed;
    --purple-light: #ede9fe;
    --purple-border: #c4b5fd;
    --excluded-bg: #e2e8f0;
    --excluded-stripe: #cbd5e1;
    --card-shadow: 0 4px 6px -1px rgba(0,0,0,.1);
}

body, html {
    height: 100vh;
    margin: 0;
    padding: 0;
    font-family: "SF Pro Display", "PingFang SC", sans-serif;
}

body {
    display: flex;
    background: var(--main-bg);
    color: #1e293b;
    overflow: hidden;
}

.sidebar {
    width: 260px;
    background: var(--sidebar-bg);
    color: white;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.sidebar-header {
    padding: 25px 20px;
    border-bottom: 1px solid #334155;
    font-weight: 800;
    font-size: 1.2em;
}

.db-list {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.db-item {
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 12px;
    cursor: pointer;
    background: #334155;
    font-size: 14px;
    transition: .2s;
}

.db-item.active {
    background: var(--primary);
}

.db-item-main {
    display: flex;
    justify-content: space-between;
    gap: 8px;
}

.db-item-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.db-item-credit {
    font-size: 10px;
    background: rgba(255,255,255,.15);
    padding: 2px 6px;
    border-radius: 999px;
    flex-shrink: 0;
}

.db-item-tip {
    margin-top: 5px;
    font-size: 10px;
    color: #cbd5e1;
}

.db-item.done .db-item-credit {
    background: var(--success);
}

.db-item.over .db-item-credit {
    background: var(--danger);
}

.sidebar-footer {
    padding: 15px;
    border-top: 1px solid #334155;
    background: rgba(0,0,0,.2);
    font-size: 11px;
    color: #94a3b8;
    line-height: 1.6;
}

.content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 15px 20px;
    min-width: 0;
    height: 100vh;
    box-sizing: border-box;
    overflow-y: auto;
}

.banner {
    background: #fefce8;
    color: #a16207;
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    font-size: 13px;
    line-height: 1.5;
    border: 1px solid #fef08a;
}

.header-tools {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
}

.group-credit-panel {
    background: white;
    border: 1px solid var(--border);
    box-shadow: var(--card-shadow);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
}

.group-credit-title {
    font-weight: 800;
}

.group-credit-info {
    color: #64748b;
    text-align: right;
    line-height: 1.5;
}

.group-credit-info strong {
    color: var(--primary);
}

.locate-input {
    width: 100%;
    padding: 12px 18px;
    border: 2px solid white;
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    box-shadow: var(--card-shadow);
    box-sizing: border-box;
}

.locate-input.searching {
    border-color: var(--highlight);
}

.filter-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.tag-chip {
    padding: 6px 15px;
    background: white;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    color: #64748b;
}

.tag-chip.active {
    background: var(--primary);
    color: white;
}

.exclusion-panel {
    background: rgba(255,255,255,.65);
    padding: 12px;
    border-radius: 16px;
    border: 1px dashed var(--border);
}

.exclusion-label {
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
}

.matrix-container {
    display: grid;
    grid-template-columns: 44px repeat(5, 1fr);
    gap: 6px;
}

.mx-cell {
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    background: white;
    border: 1px solid #e2e8f0;
    color: #64748b;
    user-select: none;
}

.mx-head-col,
.mx-head-row {
    font-weight: 800;
    background: transparent;
    border: none;
}

.mx-cell.excluded {
    background: var(--danger-light);
    color: var(--danger);
    border-color: #fda4af;
    text-decoration: line-through;
    font-weight: bold;
}

.grid-wrapper {
    flex: 1;
    min-height: 0;
    background: white;
    border-radius: 15px;
    padding: 12px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.grid {
    display: grid;
    flex: 1;
    width: 100%;
    height: 100%;
    grid-template-columns: 50px repeat(5, 1fr);
    grid-template-rows: 35px repeat(5, 1fr);
    gap: 4px;
    overflow: auto;
}

.cell {
    background: #f8fafc;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 11px;
    border: 1px solid #f1f5f9;
    text-align: center;
    overflow: hidden;
    position: relative;
}

.cell.head {
    background: none;
    font-weight: 800;
    color: #94a3b8;
    cursor: default;
    border: none;
}

.cell.active-slot {
    border: 2px solid var(--primary) !important;
    z-index: 5;
    transform: scale(1.02);
}

.cell.search-match {
    border: 2px solid var(--highlight) !important;
    color: #c2410c !important;
    font-weight: 800;
}

.cell.excluded-slot {
    background-color: var(--excluded-bg) !important;
    background-image: repeating-linear-gradient(
        45deg,
        var(--excluded-bg),
        var(--excluded-bg) 10px,
        var(--excluded-stripe) 10px,
        var(--excluded-stripe) 12px
    ) !important;
    pointer-events: none;
    opacity: .6;
    color: transparent !important;
}

.cell.conflict-slot {
    background: var(--purple-light) !important;
    border-color: var(--purple-border) !important;
    color: var(--purple) !important;
}

.cell.selected-slot {
    background: var(--success-light) !important;
    border-color: #86efac !important;
    color: var(--success) !important;
}

.side-panel {
    width: 320px;
    background: white;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.panel-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
}

.course-list {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.course-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
}

.course-card.selected {
    border-color: #86efac;
    background: #f0fdf4;
}

.course-card.conflict {
    border-color: var(--purple-border);
    background: var(--purple-light);
    opacity: .9;
}

.card-head {
    padding: 12px;
    font-weight: 700;
    font-size: 13px;
    background: #fcfcfc;
}

.card-body {
    padding: 12px;
    font-size: 12px;
    color: #64748b;
    border-top: 1px dashed var(--border);
    line-height: 1.7;
}

.card-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.select-btn {
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    background: var(--primary);
    color: white;
    font-weight: 800;
    flex: 1;
}

.select-btn.remove {
    background: var(--danger);
}

.select-btn.disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

.select-btn.conflict {
    background: var(--purple);
}

.small-badge {
    margin-top: 4px;
    font-size: 10px;
    color: #94a3b8;
    border: 1px solid #e2e8f0;
    display: inline-block;
    padding: 0 5px;
    border-radius: 4px;
}

.week-badge {
    margin-left: 5px;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    font-weight: 800;
}

.week-all {
    background: #e0f2fe;
    color: #0369a1;
}

.week-odd {
    background: #fef3c7;
    color: #b45309;
}

.week-even {
    background: #ede9fe;
    color: #6d28d9;
}

.floating-countdown {
    position: fixed;
    top: 12px;
    right: 340px;
    width: 300px;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(15,23,42,.16);
    z-index: 999;
    padding: 10px 12px;
    box-sizing: border-box;
    font-size: 12px;
}

.floating-countdown-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
}

.floating-countdown-title {
    font-weight: 800;
}

.floating-countdown-time {
    font-weight: 800;
    color: var(--primary);
    text-align: right;
}

.floating-countdown-meta {
    margin-top: 5px;
    color: #64748b;
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.floating-progress-track {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 7px;
}

.floating-progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg,#22c55e,#3b82f6);
}

.cart-panel {
    position: fixed;
    left: 14px;
    bottom: 14px;
    width: 310px;
    max-height: 62vh;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(226,232,240,.95);
    border-radius: 20px;
    box-shadow: 0 18px 40px rgba(15,23,42,.28);
    z-index: 1000;
    overflow: hidden;
}

.cart-panel.collapsed {
    width: 270px;
    max-height: 54px;
}

.cart-header {
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color: white;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-size: 13px;
    font-weight: 900;
}

.cart-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.cart-icon {
    width: 28px;
    height: 28px;
    border-radius: 10px;
    background: rgba(255,255,255,.12);
    display: flex;
    align-items: center;
    justify-content: center;
}

.cart-title-sub {
    font-size: 10px;
    font-weight: 400;
    color: #cbd5e1;
    margin-top: 2px;
}

.cart-count {
    background: var(--primary);
    color: white;
    border-radius: 999px;
    padding: 2px 7px;
    font-size: 11px;
}

.cart-toggle {
    font-size: 11px;
    color: #cbd5e1;
    background: rgba(255,255,255,.08);
    padding: 4px 8px;
    border-radius: 999px;
}

.cart-body {
    padding: 12px;
    overflow-y: auto;
    max-height: calc(62vh - 54px);
}

.cart-summary {
    background: linear-gradient(135deg,#eff6ff,#f8fafc);
    border: 1px solid #dbeafe;
    border-radius: 14px;
    padding: 11px;
    font-size: 12px;
    color: #334155;
    line-height: 1.6;
    margin-bottom: 12px;
}

.cart-summary-row {
    display: flex;
    justify-content: space-between;
}

.cart-progress-track {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
}

.cart-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#3b82f6,#22c55e);
}

.cart-group {
    border: 1px solid var(--border);
    border-radius: 15px;
    margin-bottom: 12px;
    overflow: hidden;
    background: white;
}

.cart-group.done {
    border-color: #86efac;
    background: #f0fdf4;
}

.cart-group-title {
    padding: 10px 11px;
    background: #f8fafc;
    font-size: 12px;
    font-weight: 900;
    color: #334155;
    display: flex;
    justify-content: space-between;
}

.cart-course {
    margin: 9px;
    padding: 9px;
    border-radius: 12px;
    background: white;
    border: 1px solid #e2e8f0;
    font-size: 11px;
    color: #475569;
}

.cart-course-name {
    font-weight: 800;
    color: #1e293b;
    margin-bottom: 5px;
}

.cart-remove {
    font-size: 10px;
    color: white;
    background: var(--danger);
    cursor: pointer;
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    margin-top: 6px;
}

.empty-cart {
    color: #94a3b8;
    text-align: center;
    font-size: 12px;
    padding: 24px 0;
    background: #f8fafc;
    border-radius: 14px;
    border: 1px dashed #cbd5e1;
}

@media screen and (max-width: 1024px) {
    body {
        flex-direction: column;
        overflow-y: auto;
        height: auto;
    }

    .sidebar {
        width: 100%;
        height: auto;
    }

    .db-list {
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        gap: 10px;
    }

    .db-item {
        flex-shrink: 0;
        min-width: 150px;
    }

    .sidebar-footer {
        display: none;
    }

    .content {
        height: auto;
        overflow: visible;
        padding: 10px;
    }

    .grid-wrapper {
        height: 65vh;
        min-height: 400px;
    }

    .side-panel {
        width: 100%;
        border-left: none;
        border-top: 5px solid var(--main-bg);
    }

    .floating-countdown {
        top: auto;
        left: 10px;
        right: 10px;
        bottom: 10px;
        width: auto;
    }

    .cart-panel {
        left: 10px;
        right: 10px;
        bottom: 62px;
        width: auto;
        max-height: 46vh;
    }

    .cart-panel.collapsed {
        width: auto;
    }

    .group-credit-panel {
        flex-direction: column;
    }

    .group-credit-info {
        text-align: left;
    }
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="sidebar-header">
        选课智能助手
        <span style="font-size:10px;font-weight:normal;opacity:.7;display:none;" id="mobile-hint">左右滑动切换</span>
    </div>
    <div id="menu" class="db-list"></div>
    <div class="sidebar-footer">
        <b>🚫 排除矩阵</b><br>
        点击矩阵格子可屏蔽对应时段。<br>
        已支持单周 / 双周冲突判断。
    </div>
</div>

<div class="content">
    <div id="banner" class="banner"></div>

    <div class="header-tools">
        <div id="groupCreditPanel" class="group-credit-panel"></div>

        <input type="text" id="locateSearch" class="locate-input"
               placeholder="🔍 输入课程、教师名实时筛选..."
               oninput="handleSearch()">

        <div class="exclusion-panel">
            <div class="exclusion-label">
                <span>🚫 时段排除；紫色表示与其他组已选课程冲突</span>
                <span style="font-size:9px;font-weight:normal;cursor:pointer;color:#3b82f6"
                      onclick="resetExclusion()">↺ 重置</span>
            </div>
            <div class="matrix-container" id="matrixContainer"></div>
        </div>

        <div id="filterChips" class="filter-container"></div>
    </div>

    <div class="grid-wrapper">
        <div id="grid" class="grid"></div>
    </div>
</div>

<div class="side-panel">
    <div class="panel-header">
        <div id="panelTitle" style="font-size:16px;font-weight:800;">💡 课程详情</div>
        <div id="slotInfo" style="font-size:11px;color:#94a3b8;margin-top:4px;">点击格子查看列表</div>
    </div>
    <div id="courseList" class="course-list"></div>
</div>

<div id="floatingCountdown" class="floating-countdown">
    <div class="floating-countdown-top">
        <div id="countdownTitle" class="floating-countdown-title">⏳ 选课时间</div>
        <div id="countdownTime" class="floating-countdown-time">正在计算...</div>
    </div>
    <div id="countdownMeta" class="floating-countdown-meta"></div>
    <div class="floating-progress-track">
        <div id="progressBar" class="floating-progress-bar"></div>
    </div>
</div>

<div id="cartPanel" class="cart-panel collapsed">
    <div class="cart-header" onclick="toggleCart()">
        <div class="cart-header-left">
            <div class="cart-icon">🛒</div>
            <div>
                我的选择 <span id="cartCount" class="cart-count">0</span>
                <div class="cart-title-sub" id="cartHeaderSub">点击展开查看</div>
            </div>
        </div>
        <div id="cartToggleIcon" class="cart-toggle">展开</div>
    </div>
    <div id="cartBody" class="cart-body"></div>
</div>

// ================== 学分处理 ==================
function normalizeCredit(value) {
    if (value === undefined || value === null || value === '') return 1;
    const num = Number(value);
    if (Number.isNaN(num) || num <= 0) return 1;
    return num;
}

function readCourseCredit(course) {
    if (course.credit !== undefined && course.credit !== null && course.credit !== '') {
        return normalizeCredit(course.credit);
    }

    if (course.raw && course.raw.length > 1) {
        return normalizeCredit(course.raw[1]);
    }

    if (course.xf !== undefined) {
        return normalizeCredit(course.xf);
    }

    return 1;
}

function getCourseCredit(course) {
    return normalizeCredit(course.credit !== undefined ? course.credit : readCourseCredit(course));
}

function getRequiredCredits(groupName) {
    const group = DATA_STORE[groupName];
    return Number(group && group.requiredCredits ? group.requiredCredits : 0);
}

function getSelectedCredits(groupName) {
    const list = selectedMap[groupName] || [];
    return list.reduce((sum, c) => sum + getCourseCredit(c), 0);
}

function getSelectedCount(groupName) {
    return (selectedMap[groupName] || []).length;
}

// ================== 单双周核心处理 ==================
function normalizeWeekMode(value) {
    if (!value) return '';

    const text = String(value).toLowerCase();

    if (
        text === 'odd' ||
        text.includes('单周') ||
        text.includes('单数周') ||
        text.includes('odd')
    ) {
        return 'odd';
    }

    if (
        text === 'even' ||
        text.includes('双周') ||
        text.includes('双数周') ||
        text.includes('even')
    ) {
        return 'even';
    }

    if (
        text === 'all' ||
        text.includes('每周') ||
        text.includes('全周') ||
        text.includes('1-16') ||
        text.includes('1~16')
    ) {
        return 'all';
    }

    return '';
}

function detectWeekMode(course) {
    const explicit =
        normalizeWeekMode(course.weekMode) ||
        normalizeWeekMode(course.weekType) ||
        normalizeWeekMode(course.week) ||
        normalizeWeekMode(course.zc);

    if (explicit) return explicit;

    const rawText = course.raw ? course.raw.join(' ') : '';

    const text = [
        course.s,
        course.time,
        course.remark,
        course.note,
        rawText
    ].filter(Boolean).join(' ');

    return normalizeWeekMode(text) || 'all';
}

function getWeekLabel(course) {
    const mode = course._weekMode || detectWeekMode(course);

    if (mode === 'odd') return '单周';
    if (mode === 'even') return '双周';
    return '每周';
}

function getWeekBadgeClass(course) {
    const mode = course._weekMode || detectWeekMode(course);

    if (mode === 'odd') return 'week-odd';
    if (mode === 'even') return 'week-even';
    return 'week-all';
}

function weekModeOverlap(a, b) {
    const modeA = a._weekMode || detectWeekMode(a);
    const modeB = b._weekMode || detectWeekMode(b);

    if (modeA === 'all' || modeB === 'all') return true;

    return modeA === modeB;
}

// 以后如果你想支持更精确的 1-8周 / 9-16周，可以继续扩展这里。
// 目前最重要的是：单周和双周同一时间不冲突。
function timeOverlap(a, b) {
    if (a.d !== b.d) return false;

    const periodOverlap = a.b <= b.e && a.e >= b.b;
    if (!periodOverlap) return false;

    return weekModeOverlap(a, b);
}

function prepareCourses() {
    Object.keys(DATA_STORE).forEach(groupName => {
        const courses = DATA_STORE[groupName].courses || [];

        courses.forEach((course, index) => {
            course._id = `${groupName}__${index}`;
            course.credit = readCourseCredit(course);
            course._weekMode = detectWeekMode(course);

            const matches = String(course.n || '').match(/\(([^)]+)\)$/);
            course.subCategory = matches && matches[1] ? matches[1].trim() : '其他';
        });
    });
}

function initSelectedMap() {
    Object.keys(DATA_STORE).forEach(groupName => {
        if (!selectedMap[groupName]) selectedMap[groupName] = [];
    });
}

// ================== 菜单 ==================
function renderMenu() {
    const menu = document.getElementById('menu');
    menu.innerHTML = '';

    Object.keys(DATA_STORE).forEach(key => {
        const required = getRequiredCredits(key);
        const selectedCredits = getSelectedCredits(key);
        const remain = Math.max(0, required - selectedCredits);

        const item = document.createElement('div');
        item.className = 'db-item';

        if (key === currentGroupName) item.classList.add('active');
        if (selectedCredits === required && required > 0) item.classList.add('done');
        if (selectedCredits > required) item.classList.add('over');

        item.innerHTML = `
            <div class="db-item-main">
                <span class="db-item-title">${key}</span>
                <span class="db-item-credit">${selectedCredits}/${required}学分</span>
            </div>
            <div class="db-item-tip">${remain > 0 ? `还需 ${remain} 学分` : '已满足'}</div>
        `;

        item.onclick = () => switchGroup(key);
        menu.appendChild(item);
    });
}

// ================== 倒计时 ==================
function parseDateTime(str) {
    if (!str) return null;
    return new Date(String(str).replace(/-/g, '/'));
}

function padZero(num) {
    return String(num).padStart(2, '0');
}

function formatDuration(ms) {
    if (ms <= 0) return '00天 00小时 00分 00秒';

    const totalSeconds = Math.floor(ms / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    return `${padZero(days)}天 ${padZero(hours)}小时 ${padZero(minutes)}分 ${padZero(seconds)}秒`;
}

function updateCountdown() {
    const title = document.getElementById('countdownTitle');
    const time = document.getElementById('countdownTime');
    const meta = document.getElementById('countdownMeta');
    const bar = document.getElementById('progressBar');

    const group = DATA_STORE[currentGroupName];

    if (!group) {
        title.innerText = '⏳ 选课时间';
        time.innerText = '暂无课程组';
        meta.innerText = '';
        bar.style.width = '0%';
        return;
    }

    const start = parseDateTime(group.startTime);
    const end = parseDateTime(group.endTime);
    const now = new Date();

    if (!start || !end || isNaN(start.getTime()) || isNaN(end.getTime())) {
        title.innerText = '⏳ 未设置';
        time.innerText = '请设置时间';
        meta.innerText = '';
        bar.style.width = '0%';
        return;
    }

    meta.innerText = `开始：${group.startTime}　结束：${group.endTime}`;

    if (now < start) {
        title.innerText = '⏳ 距开始';
        time.innerText = formatDuration(start - now);
        bar.style.width = '0%';
        bar.style.background = 'linear-gradient(90deg,#f59e0b,#f97316)';
        return;
    }

    if (now >= end) {
        title.innerText = '✅ 已结束';
        time.innerText = '00天 00小时 00分 00秒';
        bar.style.width = '0%';
        bar.style.background = '#94a3b8';
        return;
    }

    const total = end - start;
    const remain = end - now;
    const remainPercent = Math.max(0, Math.min(100, remain / total * 100));

    title.innerText = '🔥 距结束';
    time.innerText = formatDuration(remain);
    bar.style.width = remainPercent + '%';

    if (remainPercent > 60) {
        bar.style.background = 'linear-gradient(90deg,#22c55e,#3b82f6)';
    } else if (remainPercent > 30) {
        bar.style.background = 'linear-gradient(90deg,#f59e0b,#f97316)';
    } else {
        bar.style.background = 'linear-gradient(90deg,#f43f5e,#e11d48)';
    }
}

function startCountdown() {
    if (countdownTimer) clearInterval(countdownTimer);
    updateCountdown();
    countdownTimer = setInterval(updateCountdown, 1000);
}

// ================== 选课逻辑 ==================
function isSelected(course) {
    const list = selectedMap[currentGroupName] || [];
    return list.some(c => c._id === course._id);
}

function hasConflictWithOtherGroups(course) {
    for (const groupName of Object.keys(selectedMap)) {
        if (groupName === currentGroupName) continue;

        const list = selectedMap[groupName] || [];

        for (const selected of list) {
            if (timeOverlap(course, selected)) return true;
        }
    }

    return false;
}

function hasConflictInCurrentGroup(course) {
    const list = selectedMap[currentGroupName] || [];

    for (const selected of list) {
        if (selected._id !== course._id && timeOverlap(course, selected)) {
            return true;
        }
    }

    return false;
}

function canAddCourse(course) {
    if (isSelected(course)) {
        return { ok: false, reason: '已选择' };
    }

    if (hasConflictWithOtherGroups(course)) {
        return { ok: false, reason: '与其他组已选课程时间或周次冲突' };
    }

    if (hasConflictInCurrentGroup(course)) {
        return { ok: false, reason: '与本组已选课程时间或周次冲突' };
    }

    const required = getRequiredCredits(currentGroupName);
    const selectedCredits = getSelectedCredits(currentGroupName);
    const courseCredit = getCourseCredit(course);

    if (required > 0 && selectedCredits + courseCredit > required) {
        return { ok: false, reason: '超过该组要求学分，不能超选' };
    }

    return { ok: true, reason: '' };
}

function addCourse(courseId) {
    const course = currentPool.find(c => c._id === courseId);
    if (!course) return;

    const result = canAddCourse(course);

    if (!result.ok) {
        alert(result.reason);
        return;
    }

    selectedMap[currentGroupName].push(course);
    updateAllViews();
}

function removeCourse(groupName, courseId) {
    selectedMap[groupName] = (selectedMap[groupName] || []).filter(c => c._id !== courseId);
    updateAllViews();
}

function updateAllViews() {
    renderMenu();
    renderGroupCreditPanel();
    renderMatrixControl();
    handleSearch();
    updateCart();
}

// ================== 购物车 ==================
function toggleCart() {
    const panel = document.getElementById('cartPanel');
    const icon = document.getElementById('cartToggleIcon');

    panel.classList.toggle('collapsed');
    icon.innerText = panel.classList.contains('collapsed') ? '展开' : '折叠';
}

function getTotalSelectedCourses() {
    return Object.keys(selectedMap).reduce((sum, groupName) => {
        return sum + selectedMap[groupName].length;
    }, 0);
}

function getTotalSelectedCredits() {
    return Object.keys(selectedMap).reduce((sum, groupName) => {
        return sum + getSelectedCredits(groupName);
    }, 0);
}

function getTotalRequiredCredits() {
    return Object.keys(DATA_STORE).reduce((sum, groupName) => {
        return sum + getRequiredCredits(groupName);
    }, 0);
}

function updateCart() {
    const countEl = document.getElementById('cartCount');
    const body = document.getElementById('cartBody');
    const headerSub = document.getElementById('cartHeaderSub');

    const totalCourses = getTotalSelectedCourses();
    const totalCredits = getTotalSelectedCredits();
    const totalRequired = getTotalRequiredCredits();

    const totalPercent = totalRequired > 0
        ? Math.min(100, totalCredits / totalRequired * 100)
        : 0;

    countEl.innerText = totalCourses;
    headerSub.innerText = `${totalCredits}/${totalRequired} 学分，${totalCourses} 门`;

    let html = `
        <div class="cart-summary">
            <div class="cart-summary-row">
                <span>总进度</span>
                <span><strong>${totalCredits}</strong> / ${totalRequired} 学分</span>
            </div>
            <div class="cart-summary-row">
                <span>已选课程</span>
                <span><strong>${totalCourses}</strong> 门</span>
            </div>
            <div class="cart-progress-track">
                <div class="cart-progress-bar" style="width:${totalPercent}%;"></div>
            </div>
        </div>
    `;

    if (totalCourses === 0) {
        html += `<div class="empty-cart">还没有选择课程<br>点击右侧课程卡片加入</div>`;
        body.innerHTML = html;
        return;
    }

    Object.keys(DATA_STORE).forEach(groupName => {
        const list = selectedMap[groupName] || [];
        const required = getRequiredCredits(groupName);
        const credits = getSelectedCredits(groupName);
        const done = required > 0 && credits >= required;

        html += `
            <div class="cart-group ${done ? 'done' : ''}">
                <div class="cart-group-title">
                    <span>${groupName}</span>
                    <span>${credits}/${required}</span>
                </div>
        `;

        if (list.length === 0) {
            html += `<div class="cart-course" style="color:#94a3b8;">暂未选择</div>`;
        } else {
            list.forEach(c => {
                html += `
                    <div class="cart-course">
                        <div class="cart-course-name">
                            ${c.n}
                            <span class="week-badge ${getWeekBadgeClass(c)}">${getWeekLabel(c)}</span>
                        </div>
                        👤 ${c.t || '未知'}<br>
                        ⏰ ${c.s || '见系统'}<br>
                        🎓 ${getCourseCredit(c)} 学分<br>
                        <span class="cart-remove" onclick="removeCourse('${groupName}', '${c._id}')">移除</span>
                    </div>
                `;
            });
        }

        html += `</div>`;
    });

    body.innerHTML = html;
}

// ================== 屏蔽矩阵 ==================
function getSlotIndexByPeriod(period) {
    if (period >= 1 && period <= 2) return 0;
    if (period >= 3 && period <= 4) return 1;
    if (period >= 5 && period <= 6) return 2;
    if (period >= 7 && period <= 8) return 3;
    if (period >= 9 && period <= 10) return 4;
    return -1;
}

function isCourseExcluded(course) {
    const startIdx = getSlotIndexByPeriod(course.b);
    const endIdx = getSlotIndexByPeriod(course.e);

    if (startIdx === -1 || endIdx === -1) return false;

    for (let i = startIdx; i <= endIdx; i++) {
        if (excludedMatrix[course.d][i]) return true;
    }

    return false;
}

function isSlotExcluded(dayIdx, slotIdx) {
    return excludedMatrix[dayIdx][slotIdx];
}

function isSlotSelectedInCurrentGroup(dayIdx, slot) {
    const list = selectedMap[currentGroupName] || [];

    return list.some(c => {
        return c.d === dayIdx && c.b <= slot.end && c.e >= slot.start;
    });
}

function isSlotConflictWithOtherGroups(dayIdx, slot) {
    for (const groupName of Object.keys(selectedMap)) {
        if (groupName === currentGroupName) continue;

        const list = selectedMap[groupName] || [];

        for (const c of list) {
            if (c.d === dayIdx && c.b <= slot.end && c.e >= slot.start) {
                return true;
            }
        }
    }

    return false;
}

function renderMatrixControl() {
    const container = document.getElementById('matrixContainer');
    let html = '<div class="mx-cell" style="border:none;background:none;"></div>';

    DAYS.forEach((d, dayIdx) => {
        const isColFull = excludedMatrix[dayIdx].every(v => v === true);
        html += `<div class="mx-cell mx-head-col ${isColFull ? 'excluded' : ''}" onclick="toggleColumn(${dayIdx})">${d}</div>`;
    });

    SLOT_ROWS.forEach((slot, slotIdx) => {
        let isRowFull = true;

        for (let d = 0; d < 5; d++) {
            if (!excludedMatrix[d][slotIdx]) isRowFull = false;
        }

        html += `<div class="mx-cell mx-head-row ${isRowFull ? 'excluded' : ''}" onclick="toggleRow(${slotIdx})">${slot.label}</div>`;

        for (let d = 0; d < 5; d++) {
            const isExcluded = excludedMatrix[d][slotIdx];
            html += `<div class="mx-cell ${isExcluded ? 'excluded' : ''}" onclick="toggleMatrixCell(${d},${slotIdx})">${isExcluded ? '🚫' : ''}</div>`;
        }
    });

    container.innerHTML = html;
}

function toggleMatrixCell(d, slotIdx) {
    excludedMatrix[d][slotIdx] = !excludedMatrix[d][slotIdx];
    renderMatrixControl();
    handleSearch();
}

function toggleColumn(d) {
    const allSelected = excludedMatrix[d].every(v => v === true);
    excludedMatrix[d] = excludedMatrix[d].map(() => !allSelected);
    renderMatrixControl();
    handleSearch();
}

function toggleRow(slotIdx) {
    let allSelected = true;

    for (let d = 0; d < 5; d++) {
        if (!excludedMatrix[d][slotIdx]) allSelected = false;
    }

    for (let d = 0; d < 5; d++) {
        excludedMatrix[d][slotIdx] = !allSelected;
    }

    renderMatrixControl();
    handleSearch();
}

function resetExclusion() {
    excludedMatrix = Array(5).fill(null).map(() => Array(SLOT_ROWS.length).fill(false));
    renderMatrixControl();
    handleSearch();
}

// ================== 主课程表 ==================
function renderGrid() {
    const grid = document.getElementById('grid');

    grid.innerHTML =
        '<div class="cell head"></div>' +
        DAYS.map(d => `<div class="cell head">${d}</div>`).join('');

    SLOT_ROWS.forEach((slot, slotIdx) => {
        grid.innerHTML += `<div class="cell head">${slot.label}</div>`;

        for (let d = 0; d < 5; d++) {
            grid.innerHTML += `<div class="cell" id="cell-${d}-${slotIdx}" onclick="showSlotDetail(${d},${slotIdx})"></div>`;
        }
    });
}

function getHeatColor(count, isSearch) {
    if (count === 0) return '#f8fafc';
    if (isSearch) return '#fff7ed';

    const step = Math.min(count, 10);
    const lightness = 95 - step * 6;

    return `hsl(217, 91%, ${lightness}%)`;
}

function getBigSlotIndexByCourse(course) {
    return getSlotIndexByPeriod(course.b);
}

// ================== 切换课程组 ==================
function switchGroup(groupName) {
    currentGroupName = groupName;

    const group = DATA_STORE[groupName];
    currentPool = group.courses || [];
    currentSubTag = '全部';

    document.getElementById('banner').innerHTML = group.notice || '暂无公告';

    startCountdown();

    const subTags = new Set(['全部']);

    currentPool.forEach(c => {
        c.credit = readCourseCredit(c);
        c._weekMode = detectWeekMode(c);

        const matches = String(c.n || '').match(/\(([^)]+)\)$/);
        c.subCategory = matches && matches[1] ? matches[1].trim() : '其他';

        subTags.add(c.subCategory);
    });

    const container = document.getElementById('filterChips');
    container.innerHTML = '';

    Array.from(subTags).forEach(tag => {
        const chip = document.createElement('div');
        chip.className = `tag-chip ${tag === '全部' ? 'active' : ''}`;
        chip.innerText = tag;

        chip.onclick = () => {
            document.querySelectorAll('.tag-chip').forEach(tc => tc.classList.remove('active'));
            chip.classList.add('active');
            currentSubTag = tag;
            handleSearch();
        };

        container.appendChild(chip);
    });

    document.getElementById('locateSearch').value = '';

    renderMenu();
    renderGroupCreditPanel();
    handleSearch();
}

function getMaxAvailableCreditInCurrentGroup() {
    const credits = currentPool
        .filter(c => {
            if (isSelected(c)) return false;
            if (hasConflictWithOtherGroups(c)) return false;
            if (hasConflictInCurrentGroup(c)) return false;
            if (isCourseExcluded(c)) return false;
            return true;
        })
        .map(c => getCourseCredit(c));

    if (credits.length === 0) return 1;
    return Math.max(...credits);
}

function renderGroupCreditPanel() {
    const panel = document.getElementById('groupCreditPanel');
    const required = getRequiredCredits(currentGroupName);
    const selectedCredits = getSelectedCredits(currentGroupName);
    const selectedCount = getSelectedCount(currentGroupName);
    const remain = Math.max(0, required - selectedCredits);

    const maxAvailableCredit = getMaxAvailableCreditInCurrentGroup();
    const estimateCount = remain > 0 ? Math.ceil(remain / maxAvailableCredit) : 0;

    const statusText = remain > 0
        ? `还差 <strong>${remain}</strong> 学分，至少还需要约 <strong>${estimateCount}</strong> 门`
        : `<strong>已满足要求</strong>`;

    panel.innerHTML = `
        <div>
            <div class="group-credit-title">🎯 当前组学分要求：${required} 学分</div>
            <div style="font-size:11px;color:#94a3b8;margin-top:4px;">
                已支持单周 / 双周避让，同一时间单周和双周不会互相冲突。
            </div>
        </div>
        <div class="group-credit-info ${remain === 0 ? 'done' : ''}">
            已选 <strong>${selectedCredits}</strong> 学分，${selectedCount} 门<br>
            ${statusText}
        </div>
    `;
}

// ================== 搜索和刷新 ==================
function handleSearch() {
    currentKeyword = document.getElementById('locateSearch').value.trim().toLowerCase();
    const inputEl = document.getElementById('locateSearch');

    const visibleList = currentPool.filter(c => {
        if (isCourseExcluded(c)) return false;

        const matchTag = currentSubTag === '全部' || c.subCategory === currentSubTag;

        const name = String(c.n || '').toLowerCase();
        const teacher = String(c.t || '').toLowerCase();
        const time = String(c.s || '').toLowerCase();

        const matchKey = !currentKeyword ||
            name.includes(currentKeyword) ||
            teacher.includes(currentKeyword) ||
            time.includes(currentKeyword);

        return matchTag && matchKey;
    });

    document.querySelectorAll('.cell:not(.head)').forEach(el => {
        el.className = 'cell';
        el.style = '';
        el.innerHTML = '';
    });

    SLOT_ROWS.forEach((slot, slotIdx) => {
        for (let d = 0; d < 5; d++) {
            const el = document.getElementById(`cell-${d}-${slotIdx}`);
            if (!el) continue;

            if (isSlotExcluded(d, slotIdx)) {
                el.classList.add('excluded-slot');
                continue;
            }

            if (isSlotSelectedInCurrentGroup(d, slot)) {
                el.classList.add('selected-slot');
                el.innerHTML = `
                    <span style="font-size:16px;font-weight:800;">已</span>
                    <span style="font-size:9px;">选择</span>
                `;
            } else if (isSlotConflictWithOtherGroups(d, slot)) {
                el.classList.add('conflict-slot');
                el.innerHTML = `
                    <span style="font-size:16px;font-weight:800;">占</span>
                    <span style="font-size:9px;">部分冲突</span>
                `;
            }
        }
    });

    const counts = {};

    visibleList.forEach(c => {
        const slotIdx = getBigSlotIndexByCourse(c);
        if (slotIdx === -1) return;

        const key = `${c.d}-${slotIdx}`;

        if (!counts[key]) {
            counts[key] = {
                total: 0,
                available: 0,
                conflict: 0
            };
        }

        counts[key].total++;

        if (hasConflictWithOtherGroups(c) || hasConflictInCurrentGroup(c)) {
            counts[key].conflict++;
        } else {
            counts[key].available++;
        }
    });

    Object.keys(counts).forEach(k => {
        const el = document.getElementById(`cell-${k}`);
        if (!el || el.classList.contains('excluded-slot')) return;

        const data = counts[k];

        if (data.total > 0) {
            const subtitle = data.conflict > 0
                ? `可${data.available}/冲${data.conflict}`
                : '门';

            el.innerHTML = `
                <span style="font-size:16px;font-weight:800;">${data.total}</span>
                <span style="font-size:9px;opacity:.8;">${subtitle}</span>
            `;

            if (data.available === 0 && data.conflict > 0) {
                el.classList.add('conflict-slot');
            } else if (currentKeyword) {
                el.classList.add('search-match');
                inputEl.classList.add('searching');
            } else {
                el.style.backgroundColor = getHeatColor(data.total, false);
                el.style.color = data.total > 5 ? '#fff' : '#1e40af';
                inputEl.classList.remove('searching');
            }
        }
    });

    renderList(currentKeyword ? visibleList : null);
}

function showSlotDetail(d, slotIdx) {
    if (isSlotExcluded(d, slotIdx)) return;

    document.querySelectorAll('.cell').forEach(el => el.classList.remove('active-slot'));

    const target = document.getElementById(`cell-${d}-${slotIdx}`);
    if (target) target.classList.add('active-slot');

    const slot = SLOT_ROWS[slotIdx];

    document.getElementById('slotInfo').innerText = `${DAYS[d]} 第${slot.label}节 选中详情`;

    const slotList = currentPool.filter(c => {
        if (isCourseExcluded(c)) return false;

        const matchTag = currentSubTag === '全部' || c.subCategory === currentSubTag;

        const name = String(c.n || '').toLowerCase();
        const teacher = String(c.t || '').toLowerCase();
        const time = String(c.s || '').toLowerCase();

        const matchKey = !currentKeyword ||
            name.includes(currentKeyword) ||
            teacher.includes(currentKeyword) ||
            time.includes(currentKeyword);

        const hasOverlap = c.b <= slot.end && c.e >= slot.start;

        return matchTag && matchKey && c.d === d && hasOverlap;
    });

    renderList(slotList, true);

    if (window.innerWidth <= 1024) {
        setTimeout(() => {
            document.querySelector('.side-panel').scrollIntoView({ behavior: 'smooth' });
        }, 100);
    }
}

function renderList(list, isManual = false) {
    const container = document.getElementById('courseList');
    const titleEl = document.getElementById('panelTitle');

    if (!list && !isManual) {
        titleEl.innerText = '💡 课程详情';
        container.innerHTML = `
            <div style="color:#94a3b8;text-align:center;margin-top:50px;font-size:12px;">
                点击格子查看时段课程，或搜索课程
            </div>
        `;
        return;
    }

    titleEl.innerText = isManual ? '📍 选中节次课程' : `🔍 筛选结果 (${list.length})`;
    container.innerHTML = '';

    if (!list || list.length === 0) {
        container.innerHTML = `
            <div style="color:#f43f5e;text-align:center;margin-top:50px;font-size:12px;">
                暂无匹配课程
            </div>
        `;
        return;
    }

    list.forEach(c => {
        const card = document.createElement('div');

        const selected = isSelected(c);
        const otherConflict = hasConflictWithOtherGroups(c);
        const currentConflict = hasConflictInCurrentGroup(c);
        const addInfo = canAddCourse(c);

        card.className = 'course-card';

        if (selected) {
            card.classList.add('selected');
        } else if (otherConflict || currentConflict) {
            card.classList.add('conflict');
        }

        let buttonHtml = '';

        if (selected) {
            buttonHtml = `<button class="select-btn remove" onclick="removeCourse('${currentGroupName}', '${c._id}')">移除已选</button>`;
        } else if (otherConflict) {
            buttonHtml = `<button class="select-btn conflict disabled" onclick="alert('与其他课程组已选课程时间或周次冲突')">时间/周次冲突</button>`;
        } else if (currentConflict) {
            buttonHtml = `<button class="select-btn disabled" onclick="alert('与本组已选课程时间或周次冲突')">本组冲突</button>`;
        } else if (!addInfo.ok) {
            buttonHtml = `<button class="select-btn disabled" onclick="alert('${addInfo.reason}')">${addInfo.reason}</button>`;
        } else {
            buttonHtml = `<button class="select-btn" onclick="addCourse('${c._id}')">加入选择 +${getCourseCredit(c)}学分</button>`;
        }

        card.innerHTML = `
            <div class="card-head">
                ${c.n}
                <span class="week-badge ${getWeekBadgeClass(c)}">${getWeekLabel(c)}</span>
            </div>
            <div class="card-body">
                <div>👤 教师：${c.t || '未知'}</div>
                <div>⏰ 时间：${c.s || '见系统'}</div>
                <div>📅 周次：${getWeekLabel(c)}</div>
                <div>🎓 学分：${getCourseCredit(c)}</div>
                <div class="small-badge">${c.subCategory || '其他'}</div>
                ${
                    otherConflict
                    ? `<div style="margin-top:6px;color:var(--purple);font-weight:700;">⚠️ 与其他组已选课程时间/周次冲突</div>`
                    : ''
                }
                ${
                    currentConflict
                    ? `<div style="margin-top:6px;color:var(--danger);font-weight:700;">⚠️ 与本组已选课程时间/周次冲突</div>`
                    : ''
                }
                <div class="card-actions">${buttonHtml}</div>
            </div>
        `;

        container.appendChild(card);
    });
}

init();
</script>
